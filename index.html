<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Sky Full of Wishes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO -->

    <div class="intro">

        <h1>A little piece of the sky</h1>

        <p>leave your message ✦</p>

        <button id="enterButton">
            ENTER
        </button>

    </div>


    <!-- GALAXY -->

    <div id="galaxyScreen" class="galaxy-screen">

        <h1 class="galaxy-title">
            Choose a little world ✦
        </h1>

        <p class="galaxy-subtitle">
            every star has a story
        </p>

        <div id="planets" class="planets"></div>

    </div>


    <!-- PERSON'S SKY -->

    <div id="skyScreen" class="sky-screen">

        <button id="backToGalaxy" class="back-button">
            ← back to the sky
        </button>

        <div class="person-title">

            <h1>
                A little piece of the sky
            </h1>

            <p id="personSubtitle">
                just for you ✦
            </p>

        </div>
        
        <!-- BIRTHDAY SURPRISE -->

        <div id="birthdaySurprise" class="birthday-surprise">
            <p id="surpriseText"></p>
        </div>



                <!-- WORLD CHOICE -->

        <div id="worldChoice" class="world-choice">

            <h2 id="worldChoiceTitle">
                What would you like to do?
            </h2>

            <button id="leaveNoteChoice">
                ✦ Leave a little note
            </button>

            <button id="birthdayChoice">
                🎂 I'm ...
            </button>

        </div>


        <!-- NOTE FORM -->

        <div class="note-section">

            <h2 id="noteTitle">
                Leave a little note in the sky ✦
            </h2>

            <input
                type="text"
                id="nameInput"
                placeholder="Your name"
            >

            <textarea
                id="noteInput"
                placeholder="Write your little note..."
            ></textarea>

            <button id="sendNote">
                Leave it among the stars ✨
            </button>

        </div>

    </div>


    <!-- MESSAGE BOX -->

    <div id="messageBox" class="message-box">

        <div class="message-content">

            <button id="closeMessage">
                ×
            </button>

            <p id="messageText"></p>

        </div>

    </div>

      
    <!-- BACKGROUND MUSIC -->
    <iframe
        id="youtubePlayer"
        width="1"
        height="1"
        src="https://www.youtube.com/embed/aPnVbY0_DzM"
        frameborder="0"
        allow="autoplay"
    ></iframe>

    <script src="https://www.youtube.com/iframe_api"></script>

        
    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
